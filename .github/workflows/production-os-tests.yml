name: Production OS tests

on:
  push:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"
  pull_request:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for real media tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Run Production OS tests
        working-directory: production_os_mvp
        run: python -m unittest discover -s tests -v
      - name: Compile Python entrypoints and orchestration modules
        run: python -m py_compile production_os_mvp/app.py production_os_mvp/engine.py production_os_mvp/agents.py production_os_mvp/agent_orchestrator.py production_os_mvp/skill_registry.py production_os_mvp/runtime_registry.py production_os_mvp/mcp_registry.py production_os_mvp/media_factory.py production_os_mvp/hybrid_video.py production_os_mvp/hybrid_compute.py production_os_mvp/scene_director.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('production_os_mvp/index.html').read_text(encoding='utf-8'); script=html.rsplit('<script>', 1)[1].split('</script>', 1)[0]; Path('production_os_mvp/dashboard-check.js').write_text(script, encoding='utf-8')"
          node --check production_os_mvp/dashboard-check.js
