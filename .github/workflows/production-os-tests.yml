name: Production OS tests

on:
  push:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"
  pull_request:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Production OS tests
        working-directory: production_os_mvp
        run: python -m unittest discover -s tests -v
