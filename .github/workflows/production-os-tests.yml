name: Production OS tests

on:
  push:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"
  pull_request:
    paths:
      - "production_os_mvp/**"
      - ".github/workflows/production-os-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Production OS tests
        working-directory: production_os_mvp
        run: python -m unittest discover -s tests -v
